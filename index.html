<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3d6" />
    <meta name="description" content="Pasar Satwa: tanam, panen, dan jual hewan langka di pasar doodle yang bisa dijelajahi." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pasar Satwa</title>
    <style>
      #loader { position: fixed; inset: 0; z-index: 100; background: #fff3d6; display: grid; place-items: center; transition: opacity 0.45s ease; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .box { width: min(86vw, 360px); text-align: center; color: #3b2a1c; }
      #loader .logo { width: 100%; height: auto; overflow: visible; }
      #loader .scene { width: 100%; height: auto; margin: 6px 0 10px; overflow: visible; }
      #loader .track { height: 22px; border: 3px solid #3b2a1c; border-radius: 14px; background: #fffaf0; overflow: hidden; box-shadow: 3px 3px 0 #3b2a1c; }
      #loader .fill { height: 100%; width: 6%; border-radius: 10px; background: repeating-linear-gradient(135deg, #ff9f1c 0 12px, #ffc15e 12px 24px); transition: width 0.25s ease-out; }
      #loader small { display: block; margin-top: 12px; color: #7a6249; font-size: 13px; min-height: 18px; }
      #loader .fish { animation: jump 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #loader .fish.b { animation-delay: -1.2s; }
      #loader .bird { animation: hop 3.6s linear infinite; }
      #loader .cust { animation: walkc 5s linear infinite; }
      #loader .bob { animation: bob 0.5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
      @keyframes jump { 0%, 55%, 100% { transform: translateY(14px) rotate(-30deg); opacity: 0; } 65% { opacity: 1; } 78% { transform: translateY(-16px) rotate(0); opacity: 1; } 92% { transform: translateY(8px) rotate(40deg); opacity: 0.8; } }
      @keyframes hop { from { transform: translateX(-30px); } to { transform: translateX(330px); } }
      @keyframes walkc { from { transform: translateX(340px); } to { transform: translateX(-60px); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="box">
        <svg class="logo" viewBox="0 0 320 96" aria-label="Pasar Satwa">
          <g font-family="'Trebuchet MS','Segoe UI',sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round">
            <text x="164" y="46" font-size="46" fill="#3b2a1c" stroke="#3b2a1c" stroke-width="9" letter-spacing="2">PASAR</text>
            <text x="160" y="42" font-size="46" fill="#ff9f1c" stroke="#3b2a1c" stroke-width="3" letter-spacing="2">PASAR</text>
            <text x="164" y="90" font-size="46" fill="#3b2a1c" stroke="#3b2a1c" stroke-width="9" letter-spacing="2">SATWA</text>
            <text x="160" y="86" font-size="46" fill="#58b368" stroke="#3b2a1c" stroke-width="3" letter-spacing="2">SATWA</text>
          </g>
        </svg>
        <svg class="scene" viewBox="0 0 320 110" aria-hidden="true">
          <g stroke="#3b2a1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
            <path d="M0 96 H320" fill="none"/>
            <ellipse cx="110" cy="82" rx="76" ry="22" fill="#c9b79c"/>
            <ellipse cx="110" cy="80" rx="66" ry="17" fill="#4fc3f0"/>
            <path d="M70 80 q8 -5 16 0 M120 86 q8 -5 16 0" fill="none" stroke="#fff" stroke-width="2.4"/>
            <g class="fish"><path d="M96 70 q10 -12 22 -4 l8 -6 v14 l-8 -6 q-12 8 -22 2 z" fill="#ff7a8a"/><circle cx="102" cy="68" r="1.6" fill="#3b2a1c" stroke="none"/></g>
            <g class="fish b"><path d="M124 72 q10 -12 22 -4 l8 -6 v14 l-8 -6 q-12 8 -22 2 z" fill="#ffd84d"/><circle cx="130" cy="70" r="1.6" fill="#3b2a1c" stroke="none"/></g>
            <g class="bird"><g class="bob"><ellipse cx="0" cy="84" rx="12" ry="9" fill="#58b368"/><circle cx="9" cy="76" r="7" fill="#58b368"/><path d="M15 76 l8 2 l-8 3 z" fill="#ff9f1c"/><circle cx="11" cy="74" r="1.5" fill="#3b2a1c" stroke="none"/><path d="M-8 86 l-9 4 l9 1 z" fill="#3f78d8"/></g></g>
            <g class="cust"><g class="bob"><rect x="0" y="78" width="6" height="14" rx="3" fill="#556"/><rect x="9" y="78" width="6" height="14" rx="3" fill="#556"/><rect x="-3" y="58" width="21" height="24" rx="8" fill="#e2574c"/><circle cx="7.5" cy="48" r="10" fill="#f4c9a0"/><path d="M-2 47 Q7.5 34 17 47 Q7.5 42 -2 47 Z" fill="#5b341b"/><circle cx="4" cy="49" r="1.5" fill="#3b2a1c" stroke="none"/><circle cx="11" cy="49" r="1.5" fill="#3b2a1c" stroke="none"/></g></g>
          </g>
        </svg>
        <div class="track"><div class="fill" id="lfill"></div></div>
        <small id="ltip">Menyiapkan pasar...</small>
      </div>
    </div>
    <div id="app">
      <header id="hud"></header>
      <main id="stage">
        <div id="game"></div>
        <div id="float"></div>
      </main>
      <nav id="dock"></nav>
      <div id="modal-root"></div>
      <div id="toast-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
